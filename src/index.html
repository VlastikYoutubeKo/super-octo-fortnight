<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Proxy Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root {
  --bg-base: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --border: #334155;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --success: #10b981;
  --warning: #f59e0b;
  --radius: 12px;
  --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg-base); color:var(--text-main); line-height:1.6; font-size: 14px; -webkit-font-smoothing: antialiased; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { padding: 30px 0; margin-bottom: 30px; display: flex; flex-direction: column; gap: 5px; }
h1 { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
.subtitle { color: var(--text-muted); font-size: 14px; }
.tabs { display: flex; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 5px; }
.tab { padding: 10px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-muted); transition: all 0.2s ease; white-space: nowrap; }
.tab:hover { color: var(--text-main); border-color: var(--accent); }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
.tab-content { display: none; animation: fadeIn 0.3s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow); }
.card h3 { margin-bottom: 15px; font-size: 18px; font-weight: 600; color: #fff; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
.stat { background: linear-gradient(145deg, var(--bg-card), #172033); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; align-items: flex-start; }
.stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
.stat-value { font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1; }
.stream { background: var(--bg-base); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--accent); transition: transform 0.2s; }
.stream:hover { transform: translateX(3px); }
.stream-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.stream-title { font-weight: 600; font-family: monospace; font-size: 15px; color: #fff; background: #000; padding: 4px 8px; border-radius: 6px; }
.stream-info { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
.stream-url { font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 6px; word-break: break-all; color: var(--text-main); }
button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
button:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.secondary { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border); }
button.secondary:hover { background: #475569; border-color: #64748b; }
button.danger { background: var(--danger); }
button.danger:hover { background: var(--danger-hover); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
.controls { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
.empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px dashed var(--border); }
.provider { background: var(--bg-base); border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--success); }
.provider-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
.provider-name { font-weight: 600; font-size: 16px; color: #fff; margin-bottom: 4px; }
.provider-url { font-size: 12px; color: var(--text-muted); font-family: monospace; }
input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 12px; border: 1px solid var(--border); background: var(--bg-base); color: var(--text-main); border-radius: 6px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
.form-group { margin-bottom: 20px; }
.error { color: #fca5a5; font-size: 13px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 6px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
.loading { text-align: center; padding: 50px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 15px; }
.loading::after { content: ""; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { display: inline-block; background: var(--bg-hover); color: var(--text-main); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px; letter-spacing: 0.5px; }
.badge.warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
.badge.danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
.modal.active { display: flex; opacity: 1; }
.modal-content { background: var(--bg-card); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; transform: scale(0.95); transition: transform 0.3s ease; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
.modal.active .modal-content { transform: scale(1); }
.modal-header { font-size: 20px; font-weight: 600; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); color: #fff; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding-top: 20px; border-top: 1px solid var(--border); margin-top: 20px; }
.url-list { margin: 15px 0; }
.url-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
.url-item input { flex: 1; margin-bottom: 0; }
.cat-item { padding: 15px; background: var(--bg-base); border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
.cat-item:hover { background: var(--bg-hover); border-color: var(--border); transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
.stream-item { padding: 15px; border-radius: 8px; border-left: 3px solid var(--text-muted); margin-bottom: 10px; background: var(--bg-base); transition: all 0.2s; }
.stream-item:hover { border-left-color: var(--accent); background: var(--bg-hover); }
.stream-name { font-weight: 600; margin-bottom: 6px; color: #fff; font-size: 15px; }
.stream-meta { font-size: 12px; color: var(--text-muted); font-family: monospace; }
.back-btn { display: inline-flex; align-items: center; gap: 5px; }
.epg-entry { margin-top: 12px; padding: 12px; background: rgba(0,0,0,0.2); border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; }
.epg-title { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 4px; }
.epg-desc { font-size: 12px; color: var(--text-muted); }
.svg-icon { width: 16px; height: 16px; fill: currentColor; }
@media(max-width:768px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stream-header, .provider-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .controls { flex-direction: column; }
  button { width: 100%; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Stream Proxy Manager</h1>
    <div class="subtitle">Production IPTV proxy with Xtream Codes integration</div>
  </header>
  <div id="app"></div>
</div>
<div id="modal" class="modal"></div>

<script>
const API = window.location.protocol + '//' + window.location.host + '/api';
let S = {
  status: null, config: null, tab: 'dashboard', loading: true, error: null,
  provider: null, categories: null, category: null, streams: null, modal: null,
  perPage: 10, catPage: 0, showCats: false, epg: null, epgStream: null
};

// SVG Icons
const icons = {
  refresh: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>',
  play: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  copy: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>',
  tv: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>',
  trash: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  edit: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
  plus: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>',
  download: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>',
  back: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>'
};

async function get(u) { const r = await fetch(API + u); return await r.json(); }
async function post(u, d) { const r = await fetch(API + u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }); return await r.json(); }
async function del(u) { const r = await fetch(API + u, { method: 'DELETE' }); return await r.json(); }

function fmt(s) {
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h + 'h ' + (m ? m + 'm' : '');
}
function uptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}
function dec(b) { try { return decodeURIComponent(escape(atob(b))); } catch(e) { try { return atob(b); } catch(e2) { return b; } } }

function Stats() {
  return `<div class="stats">
    <div class="stat"><div class="stat-label">Streams</div><div class="stat-value">${S.status.total_streams}</div></div>
    <div class="stat"><div class="stat-label">Clients</div><div class="stat-value">${S.status.total_clients}</div></div>
    <div class="stat"><div class="stat-label">Uptime</div><div class="stat-value">${uptime(S.status.uptime)}</div></div>
    <div class="stat" title="External Bypass Redirect"><div class="stat-label">Bypass</div><div class="stat-value" style="color: ${S.status.redirect_mode ? 'var(--success)' : 'var(--text-muted)'}">${S.status.redirect_mode ? 'Active' : 'Off'}</div></div>
    <div class="stat" title="Internal TS to M3U8 Redirect"><div class="stat-label">TS→M3U8</div><div class="stat-value" style="color: ${S.status.internal_m3u8 ? 'var(--success)' : 'var(--text-muted)'}">${S.status.internal_m3u8 ? 'Active' : 'Off'}</div></div>
  </div>`;
}

function Stream(s) {
  return `<div class="stream">
    <div class="stream-header">
      <div class="stream-title">${s.key}</div>
      <button class="danger" onclick="kill('${s.key}')" title="Kill Stream">${icons.trash} Kill</button>
    </div>
    <div class="stream-info">
      Clients: <strong style="color:#fff">${s.clients}</strong> &bull; 
      Age: ${fmt(s.age)} &bull; 
      Avg: <strong>${s.kbps || 0} Kbps</strong> &bull; 
      Now: <strong style="color:var(--accent)">${(s.mbps || 0).toFixed(2)} Mbps</strong>
      ${s.error ? ' <span class="badge danger">Error</span>' : ''}
    </div>
    <div class="stream-url">${s.url}</div>
    ${s.error ? `<div class="error" style="margin-top:10px">${s.error}</div>` : ''}
  </div>`;
}

function Dashboard() {
  const st = S.status;
  return `<div class="controls">
    <button onclick="load()">${icons.refresh} Refresh Status</button>
    <button class="${st.fallback_mode ? 'secondary' : 'danger'}" onclick="toggleFallback()">${st.fallback_mode ? 'Disable Fallback Mode' : 'Force Fallback Mode'}</button>
    <button class="${st.redirect_mode ? 'success' : 'secondary'}" onclick="toggleRedirect()" title="Redirect clients directly to the upstream source (bypassing proxy)">${st.redirect_mode ? 'External Bypass: ON' : 'External Bypass: OFF'}</button>
    <button class="${st.internal_m3u8 ? 'success' : 'secondary'}" onclick="toggleInternalM3u8()" title="Internally redirect .ts requests to .m3u8 variants before proxying">${st.internal_m3u8 ? 'Internal TS→M3U8: ON' : 'Internal TS→M3U8: OFF'}</button>
    <button class="primary" onclick="cycleEngine()" title="Switch streaming engine (Pure HTTP, TSDuck, FFmpeg, GStreamer)">Engine: ${st.engine ? st.engine.toUpperCase() : 'HTTP'}</button>
  </div>
  <div id="dashboard-data">
    ${DashboardData()}
  </div>`;
}

function DashboardData() {
  const st = S.status;
  return `
  ${Stats()}
  ${st.cooldowns && st.cooldowns.length > 0 ? `<div class="card"><h3>Cooldowns</h3>${st.cooldowns.map(c => `<div style="margin-top:10px; font-family:monospace; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px;"><code>${c.key}</code> <span style="color:var(--warning); float:right">${c.remaining}s remaining</span></div>`).join('')}</div>` : ''}
  <div class="card">
    <h3 style="margin-bottom:15px; display:flex; align-items:center; gap:8px;">Active Streams <span class="badge">${st.streams.length}</span></h3>
    ${st.streams.length === 0 ? '<div class="empty">No streams currently active. Clients need to request a stream first.</div>' : st.streams.map(Stream).join('')}
  </div>`;
}

function updateDashboardData() {
  const el = document.getElementById('dashboard-data');
  if (el) el.innerHTML = DashboardData();
}

function Sources() {
  const srcs = Object.entries(S.config.sources);
  return `<div class="controls">
    <button onclick="addSource()">${icons.plus} Add Custom Source</button>
  </div>
  <div class="card">
    <h3 style="margin-bottom:15px">Configured Sources</h3>
    ${srcs.length === 0 ? '<div class="empty">No custom sources defined in config.json</div>' : 
    srcs.map(([id, urls]) => `<div class="stream">
      <div class="stream-header">
        <div class="stream-title">Source ID: ${id}</div>
        <div style="display:flex; gap:8px;">
          <button class="secondary" onclick="editSource('${id}')">${icons.edit} Edit</button> 
          <button class="danger" onclick="delSource('${id}')">${icons.trash}</button>
        </div>
      </div>
      <div class="stream-info">${urls.length} target URL(s) configured for failover</div>
      ${urls.map((u, i) => `<div class="stream-url" style="margin-top:5px; opacity:0.9"><span style="color:var(--accent); font-weight:bold; margin-right:5px">${i + 1}.</span> ${u}</div>`).join('')}
    </div>`).join('')}
  </div>`;
}

function Xtream() {
  const pvs = Object.entries(S.config.xtream_providers || {});
  
  if (S.provider) {
    const p = S.config.xtream_providers[S.provider];
    const perPage = S.perPage || 10;
    const page = S.catPage || 0;
    const totalPages = S.categories ? Math.ceil(S.categories.length / perPage) : 0;
    const paginatedCats = S.categories ? S.categories.slice(page * perPage, (page + 1) * perPage) : [];
    const showCats = !S.category || S.showCats;
    
    return `<div class="controls">
      <button onclick="S.provider=null;S.categories=null;S.category=null;S.streams=null;S.showCats=false;S.catPage=0;render()" class="secondary back-btn">${icons.back} Back to Providers</button>
      <button onclick="loadCats()">${icons.refresh} Refresh API</button>
    </div>
    
    <div class="card" style="border-left: 4px solid var(--success)">
      <h3>${p.name}</h3>
      <div class="provider-url">${p.url}</div>
      <div style="margin-top:12px; font-size:13px; color: var(--text-muted); display:flex; gap:15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;">
        <span><strong>User:</strong> <span style="color:#fff">${p.username}</span></span>
        <span><strong>Source ID:</strong> <span style="color:var(--accent); font-weight:bold">${p.source_id || 'N/A'}</span></span>
      </div>
    </div>
    
    ${showCats ? `<div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
        <h3>Categories</h3>
        <div style="display:flex; gap:10px; align-items:center">
          <label style="margin:0; font-size:12px">Items per page:</label>
          <select onchange="S.perPage=parseInt(this.value);S.catPage=0;render()" style="padding:6px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; width:auto; background:var(--bg-base)">
            <option value="10" ${perPage === 10 ? 'selected' : ''}>10</option>
            <option value="25" ${perPage === 25 ? 'selected' : ''}>25</option>
            <option value="50" ${perPage === 50 ? 'selected' : ''}>50</option>
            <option value="100" ${perPage === 100 ? 'selected' : ''}>100</option>
          </select>
        </div>
      </div>
      
      ${!S.categories ? '<div class="loading">Loading Categories...</div>' : 
        S.categories.length === 0 ? '<div class="empty">No categories found in this provider.</div>' : 
        `${paginatedCats.map(c => `
          <div class="cat-item" onclick="loadStreams('${c.id}', '${c.name.replace(/'/g, "\\'")}')">
            <span style="font-weight:500; color:#fff">${c.name}</span>
            <span style="color:var(--accent); font-weight:bold">→</span>
          </div>`).join('')}
          
          ${totalPages > 1 ? `
            <div style="display:flex; gap:8px; margin-top:20px; justify-content:center; flex-wrap:wrap">
              ${page > 0 ? `<button class="secondary" onclick="S.catPage=${page - 1};render()">← Prev</button>` : ''}
              ${Array.from({ length: Math.min(7, totalPages) }, (v, i) => {
                let pNum = i;
                if (totalPages > 7) {
                  if (page > 3 && page < totalPages - 3) pNum = page - 3 + i;
                  else if (page >= totalPages - 3) pNum = totalPages - 7 + i;
                }
                return `<button class="${pNum === page ? '' : 'secondary'}" onclick="S.catPage=${pNum};render()" style="padding:8px 12px">${pNum + 1}</button>`;
              }).join('')}
              ${page < totalPages - 1 ? `<button class="secondary" onclick="S.catPage=${page + 1};render()">Next →</button>` : ''}
            </div>` : ''}
        `
      }
    </div>` : ''}
    
    ${S.category ? `<div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:15px; padding-bottom:15px; border-bottom:1px solid var(--border);">
        <h3 style="margin:0; color:var(--accent)">${S.category.name}</h3>
        <div style="display:flex; gap:10px;">
          ${!showCats ? `<button class="secondary" onclick="S.showCats=true;render()">${icons.back} Categories</button>` : ''}
          <a href="${API}/xtream/providers/${S.provider}/category/${S.category.id}/playlist.m3u" target="_blank" download="playlist_${S.category.id}.m3u" style="display:inline-flex; align-items:center; gap:6px; background:var(--bg-hover); color:var(--text-main); border:none; padding:10px 16px; font-size:13px; font-weight:600; text-decoration:none; border-radius:6px; transition:all 0.2s" onmouseover="this.style.background='#475569'" onmouseout="this.style.background='var(--bg-hover)'">${icons.download} Download M3U</a>
        </div>
      </div>
      
      ${!S.streams ? '<div class="loading">Loading streams...</div>' : 
        S.streams.length === 0 ? '<div class="empty">No streams found in this category.</div>' : 
        S.streams.map(s => {
          const sid = s.stream_id || s.id;
          const proxyUrl = window.location.protocol + "//" + window.location.hostname + ":9000/" + p.source_id + "/" + sid + ".ts";
          const rawUrl = `${p.url}/live/${p.username}/${p.password}/${sid}.ts`;
          
          return `<div class="stream-item">
            <div class="stream-name">${s.name}</div>
            <div class="stream-meta">Stream ID: <span style="color:#fff">${sid}</span>${s.epg_channel_id ? ' &bull; EPG ID: <span style="color:#fff">' + s.epg_channel_id + '</span>' : ''}</div>
            
            <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap">
              <button onclick="window.open('${proxyUrl}','_blank')">${icons.play} Play via Proxy</button>
              <button onclick="copyUrl('${proxyUrl}', event)" class="secondary">${icons.copy} Copy Proxy Link</button>
              
              <button onclick="window.open('${rawUrl}','_blank')" class="secondary" style="opacity:0.8">${icons.play} Play Raw</button>
              <button onclick="copyUrl('${rawUrl}', event)" class="secondary" style="opacity:0.8">${icons.copy} Copy Raw Link</button>
              
              ${s.stream_id ? `<button onclick="loadEPG('${s.stream_id}')" class="secondary" style="margin-left:auto; border:1px solid var(--border)">${icons.tv} View EPG</button>` : ''}
            </div>
            
            ${S.epg && S.epgStream == sid ? `
              <div class="epg-entry">
                <div style="font-weight:600; color:var(--text-main); margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.1)">Electronic Program Guide (Next 5)</div>
                ${S.epg.epg_listings && S.epg.epg_listings.length > 0 ? 
                  S.epg.epg_listings.slice(0, 5).map(e => `
                    <div style="margin-bottom:12px;">
                      <div class="epg-title"><span style="color:var(--accent); font-family:monospace; margin-right:8px">${e.start}</span> ${dec(e.title)}</div>
                      ${e.description ? `<div class="epg-desc">${dec(e.description)}</div>` : ''}
                    </div>
                  `).join('') : '<div style="font-size:13px; color:var(--warning)">No EPG data available for this stream at this time.</div>'
                }
              </div>
            ` : ''}
          </div>`;
        }).join('')
      }
    </div>` : ''}
    `;
  }
  
  return `<div class="card">
    <h3 style="margin-bottom:15px">Xtream API Providers</h3>
    ${pvs.length === 0 ? '<div class="empty">No Xtream providers detected in config.json. Add one under "xtream_providers".</div>' : 
    pvs.map(([id, p]) => `<div class="provider">
      <div class="provider-header">
        <div>
          <div class="provider-name">${p.name}</div>
          <div class="provider-url">${p.url}</div>
          <div class="provider-url" style="color:var(--accent); font-size: 11px; margin-top: 5px; font-weight:bold;">Config ID: ${id}</div>
        </div>
        <button onclick="viewProvider('${id}')">Browse Contents →</button>
      </div>
    </div>`).join('')}
  </div>`;
}

async function load(bg = false) {
  if (!bg) { S.loading = true; render(); }
  try {
    [S.status, S.config] = await Promise.all([get('/status'), get('/config')]);
    S.loading = false; S.error = null;
    
    if (bg && S.tab === 'dashboard') {
      const el = document.getElementById('dashboard-data');
      if (el) { updateDashboardData(); return; }
    }
  } catch(e) {
    S.error = 'Failed to connect to proxy API: ' + e.message; S.loading = false;
  }
  render();
}

async function kill(k) { if(confirm('Terminate stream ' + k + '?')) { await del('/streams/' + encodeURIComponent(k)); load(); } }
async function toggleFallback() { await post('/fallback', {}); load(); }
async function toggleRedirect() { await post('/redirect', {}); load(); }
async function toggleInternalM3u8() { await post('/internal_m3u8', {}); load(); }
async function cycleEngine() { 
  const engines = ['http', 'ffmpeg', 'tsduck', 'gstreamer'];
  let cur = S.status.engine || 'http';
  let idx = engines.indexOf(cur);
  let next = engines[(idx + 1) % engines.length];
  await post('/engine', {engine: next}); 
  load(); 
}

function addSource() { S.modal = { mode: 'add', id: '', urls: [''] }; showModal(); }
function editSource(id) { S.modal = { mode: 'edit', id, urls: [...S.config.sources[id]] }; showModal(); }
async function delSource(id) {
  if(confirm('Are you sure you want to delete source ' + id + '?')) {
    const s = { ...S.config.sources }; delete s[id];
    await post('/sources', { sources: s }); load();
  }
}

function showModal() {
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal-content">
    <div class="modal-header">${S.modal.mode === 'add' ? 'Add New' : 'Edit'} Source</div>
    <div class="modal-body">
      <div class="form-group">
        <label>Source ID (e.g. "1" or "vip")</label>
        <input id="sid" value="${S.modal.id}" ${S.modal.mode === 'edit' ? 'readonly style="opacity:0.6"' : ''} placeholder="e.g. 3">
      </div>
      <div class="form-group">
        <label>Target URLs (use {channel_id} as placeholder for dynamic linking)</label>
        <div id="urls">
          ${S.modal.urls.map((u, i) => `
            <div class="url-item">
              <input class="url-input" data-i="${i}" value="${u}" placeholder="http://server:80/live/user/pass/{channel_id}.ts">
              <button class="danger" onclick="remUrl(${i})" style="padding:12px">${icons.trash}</button>
            </div>
          `).join('')}
        </div>
        <button class="secondary" onclick="addUrl()" style="margin-top:15px">${icons.plus} Add Alternative URL</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button onclick="saveSource()">Save Source</button>
    </div>
  </div>`;
  m.classList.add('active');
}

function addUrl() { S.modal.urls.push(''); showModal(); }
function remUrl(i) { S.modal.urls.splice(i, 1); if(S.modal.urls.length === 0) S.modal.urls = ['']; showModal(); }
function closeModal() { document.getElementById('modal').classList.remove('active'); }

async function saveSource() {
  const id = document.getElementById('sid').value.trim();
  if(!id) { alert('Enter a valid Source ID'); return; }
  const urls = Array.from(document.querySelectorAll('.url-input')).map(i => i.value.trim()).filter(u => u);
  if(urls.length === 0) { alert('Add at least one valid URL'); return; }
  const s = { ...S.config.sources, [id]: urls };
  await post('/sources', { sources: s });
  closeModal(); load();
}

async function viewProvider(id) {
  S.provider = id; S.categories = null; S.category = null; S.streams = null;
  S.showCats = false; S.catPage = 0; S.epg = null; S.epgStream = null;
  render(); loadCats();
}
async function loadCats() {
  const r = await get('/xtream/providers/' + S.provider + '/categories?type=live');
  S.categories = r.categories || []; S.catPage = 0; render();
}
async function loadStreams(id, name) {
  S.category = { id, name }; S.streams = null; S.showCats = false; S.epg = null; S.epgStream = null; render();
  const r = await get('/xtream/providers/' + S.provider + '/streams?type=live&category_id=' + id);
  S.streams = r.streams || []; render();
}
async function loadEPG(streamId) {
  if (S.epgStream === streamId) { S.epg = null; S.epgStream = null; render(); return; }
  S.epgStream = streamId; S.epg = null; render();
  const r = await get('/xtream/providers/' + S.provider + '/epg/' + streamId);
  S.epg = r.epg || {}; render();
}

function copyUrl(url, event) {
  if (!navigator.clipboard) { prompt('Copy this URL:', url); return; }
  navigator.clipboard.writeText(url).then(() => {
    const btn = event ? event.currentTarget : null;
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copied!'; btn.style.color = 'var(--success)'; btn.style.borderColor = 'var(--success)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
    }
  }).catch(() => prompt('Copy this URL:', url));
}

function render() {
  const a = document.getElementById('app');
  if (S.loading && !S.status) { a.innerHTML = '<div class="loading">Connecting to API...</div>'; return; }
  if (S.error) { a.innerHTML = '<div class="error" style="font-size:15px"><strong>Connection Error:</strong> ' + S.error + '</div>'; return; }
  
  const tabs = ['dashboard', 'sources', 'xtream'];
  a.innerHTML = `
    <div class="tabs">
      ${tabs.map(t => `<button class="tab ${S.tab === t ? 'active' : ''}" onclick="S.tab='${t}';render()">${t.charAt(0).toUpperCase() + t.slice(1)}</button>`).join('')}
    </div>
    <div class="tab-content ${S.tab === 'dashboard' ? 'active' : ''}">${Dashboard()}</div>
    <div class="tab-content ${S.tab === 'sources' ? 'active' : ''}">${Sources()}</div>
    <div class="tab-content ${S.tab === 'xtream' ? 'active' : ''}">${Xtream()}</div>
  `;
}

setInterval(() => { if (S.tab === 'dashboard' && !S.loading) load(true); }, 3000);
load();
</script>
</body>
</html>eam' ? 'active' : ''}">${Xtream()}</div>
  `;
}

setInterval(() => { if (S.tab === 'dashboard' && !S.loading) load(true); }, 3000);
load();
