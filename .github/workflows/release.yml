name: Build and Release Go Proxy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binaries
        run: |
          cd src
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -o ../proxy_server_linux_amd64 *.go
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -o ../proxy_server_linux_arm64 *.go
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -o ../proxy_server_windows_amd64.exe *.go
          # Windows ARM64
          GOOS=windows GOARCH=arm64 go build -o ../proxy_server_windows_arm64.exe *.go

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            proxy_server_linux_amd64
            proxy_server_linux_arm64
            proxy_server_windows_amd64.exe
            proxy_server_windows_arm64.exe
